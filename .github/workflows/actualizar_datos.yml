name: Actualizar dataset de cobre y minerales críticos

on:
  schedule:
    # Todos los lunes a las 09:00 UTC (04:00 hora Colombia)
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ejecutar-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias del pipeline
        run: pip install -r pipeline/requirements.txt

      - name: Ejecutar pipeline completo
        id: pipeline
        run: python pipeline/run_pipeline.py
        continue-on-error: true

      # Se publica SIEMPRE, incluso si el pipeline falló a mitad de camino
      # (agregado 15-sep-2026, respuesta a "si FRED está caído... ¿qué pasa?"):
      # antes de esto, una corrida fallida en CI solo dejaba el mensaje
      # genérico "Process completed with exit code 1", sin evidencia de en
      # qué fase falló ni cuánto tardó cada una hasta ese punto.
      - name: Publicar log de ejecución como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ejecucion-log-${{ github.run_id }}
          path: pipeline/_out/ejecucion_log.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit y push si hay cambios en los datos
        if: steps.pipeline.outcome == 'success'
        run: |
          git config user.name "pipeline-cobre-colombia[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/live data/consolidado pipeline/_out
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos — no se hace commit."
          else
            git commit -m "chore(datos): actualización automática del pipeline [skip ci]"
            git push
          fi

      - name: Marcar el job como fallido si el pipeline falló
        if: steps.pipeline.outcome == 'failure'
        run: |
          echo "El pipeline falló -- ver el artefacto 'ejecucion-log-${{ github.run_id }}' para el detalle por fase."
          exit 1
